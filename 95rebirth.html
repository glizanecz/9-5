<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>9-5 Simulator Remastered</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="icon" href="./95favicon.png" type="image/x-icon">
    <link rel="apple-touch-icon" sizes="186x186" href="apple-touch-icon.png">
  </head>
  <body>
    <main>
        <div id="mainMenu" class="mainMenuDisplay">
            <h3 class="h3Title">☕︎ 9/5 Simulator 💼</h3>
            <h5 class="h3Title"><a href="https://www.glizanec.com/coding/95-simulator-new/changelogs/v1-0-changelog" target="_blank">View Changelog V1.0</a></h5>
            <button id="resumeGame" class="mainMenuDecisions">Resume Game</button>
            <button id="startNewGame" class="mainMenuDecisions">Start New Game</button>
            <button id="loadFromSave" class="mainMenuDecisions">Load From Save</button>
            <button id="viewSettings" class="mainMenuDecisions">Settings</button>
        </div>

        <div id="settingsMenu" class="mainMenuDisplay">
            <h3 class="h3Title">Settings</h3>
            <button id="darkModeToggle" class="mainMenuDecisions">Toggle Dark Mode</button>
            <button id="greenModeToggle" class="mainMenuDecisions">Toggle Green Mode</button>
            <button id="purpleModeToggle" class="mainMenuDecisions">Toggle Purple Mode</button>
            <button id="orangeModeToggle" class="mainMenuDecisions">Toggle Orange Mode</button>
            <button id="goldenModeToggle" class="mainMenuDecisions">Toggle Golden Mode</button>
            <button id="returnToMMSettings" class="mainMenuDecisions">Return to Main Menu</button>
        </div>

        <div id="loadFromSaveMenu" class="mainMenuDisplay">
            <h3 class="h3Title">Load Game</h3>
            <button id="btmmolg" class="mainMenuDecisions">Return to Main Menu</button>
            <input>
            <button>Submit</button>
        </div>

        <div id="gameDisplay" class="gameDisplayTab">
            <div id="menuBar" class="menuBar"><button class="menuButtons" id="goToMainMenu">Home</button> <button class="menuButtons" id="goToClickingTab">Write</button></div>
            <br>
            <div id="clickMenu" class="clickMenuDisplay">
                <h3 id="paperCount" class="paperCount">Papers Written: 0</h3>
                <h4 id="moneyCount" class="moneyCount">Money: $0</h4>
                <button id="writePaperBtn" class="writePaperBtn">Write Paper</button>
                <button id="buyWorkerBtn" class="buyWorkerBtn">Hire Writer: $200</button>
                <br>
                <br>
                <div>
                    <h2 class="fancyText" id="cofShopMultiDisplay">Coffee Shop (No Multipliers Currently Active)</h2>
                    <button id="buyCoffee" class="buyWorkerBtn">Buy Coffee (+.5x papers) | $10</button>
                    <button id="buyEngDrink" class="buyWorkerBtn">Buy Energy Drink (+2.5x papers) | $75</button>
                </div>
                <textarea readonly id="fakeTempConsole"></textarea>
            </div>

        </div> 
    </main>
    <script src="definitions.js"></script>
    <script src="saveGame.js"></script>
    <script src="game.js"></script>
    
  </body>
</html>
