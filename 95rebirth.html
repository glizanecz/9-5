<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>9-5 Simulator Remastered</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="icon" href="./95favicon.png" type="image/x-icon">
  </head>
  <body>
    <main>
        <div id="mainMenu" class="mainMenuDisplay">
            <h3 class="h3Title">☕︎ 9/5 Simulator 💼</h3>
            <button id="resumeGame" class="mainMenuDecisions">Resume Game</button>
            <button id="startNewGame" class="mainMenuDecisions">Start New Game</button>
            <button id="loadFromSave" class="mainMenuDecisions">Load From Save</button>
            <button id="viewSettings" class="mainMenuDecisions">Settings</button>
        </div>

        <div id="gameDisplay" class="gameDisplayTab">
            <div class="menuBar"><button class="menuButtons" id="goToMainMenu">Home</button> <button class="menuButtons" id="goToClickingTab">Write</button></div>
            <br>
            <div id="clickMenu" class="clickMenuDisplay">
                <h3 id="paperCount" class="paperCount">Papers Written: 0</h3>
                <h4 id="moneyCount" class="moneyCount">Money: $0</h4>
                <button id="writePaperBtn" class="writePaperBtn">Write Paper</button>
                <button id="convertPapers" class="buyWorkerBtn">Sell Articles: $1.50</button>
                <button id="buyWorkerBtn" class="buyWorkerBtn">Hire Writer: $200</button>
            </div>
        </div> 
    </main>
    <script src="definitions.js"></script>
    <script src="saveGame.js"></script>
    <script src="game.js"></script>
    
  </body>
</html>
