<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>9-5 Simulator Remastered</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="icon" href="./95favicon.png" type="image/x-icon">
  </head>
  <body>
    <main>
        <div id="mainMenu" class="mainMenuDisplay">
            <h3 class="h3Title">☕︎ 9/5 Simulator 💼</h3>
            <button id="startNewGame" class="mainMenuDecisions">Start New Game</button>
            <button id="loadFromSave" class="mainMenuDecisions">Load From Save</button>
            <button id="viewSettings" class="mainMenuDecisions">Settings</button>
        </div>
        <div id="menuBar">
            <button class="menuBar" id="goToClickingTab">Main</button>
        </div>
        <div id="clickMenu" class="clickMenuDisplay">
            <h3 class="paperCount" id="paperCount">Papers Written: 0</h3>
            <button class="writePaperBtn" id="writePaperBtn">Write Paper</button>
            <br>
            <button class="buyWorkerBtn" id="buyWorkerBtn">Buy Worker</button>
        </div>
    </main>
    <script src="definitions.js"></script>
    <script src="game.js"></script>
  </body>
</html>
