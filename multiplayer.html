<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="sectionName">9/5 Simulator Multiplayer</title>

<style>
    body {
      font-family: Arial, sans-serif;
      background: #f5c7c7;
    }

    input {
      display: block;
      margin: 10px auto;
      padding: 8px;
    }

    button {
      padding: 8px 12px;
      margin: 5px;
      cursor: pointer;
      border-radius: 5px;
    }

    #status {
      font-weight: bold;
    }

    .mainValuesDis {
        font-size: large;
        padding: 5px;
    }

    .loginBox {
        text-align: center;
    }

  </style>
</head>
<body>
<div class="loginBox" id="loginBox">
    <h1>9/5 Simulator Login</h1>

    <input id="email" placeholder="Email">
    <input id="password" placeholder="Password" type="password">

    <button id="signupBtn">Sign Up</button>
    <button id="loginBtn">Log In</button>
    <button id="logoutBtn">Log Out</button>

    <p id="status"></p>

</div>

<div id="game">
    <div id="mainGame">
        <h1 id="moneyDis" class="mainValuesDis">Money: $0</h1>
        <h1 id="papersDis" class="mainValuesDis">Papers Written: 0</h1>
        <h1 id="workersHiredDis" class="mainValuesDis">Workers Hired: 0</h1>
    </div>
</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics.js";
    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    import {
      getFirestore,
      doc,
      getDoc,
      setDoc
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB8xaqKa_oKDIVcjaIydsfmenEKmfqQsmo",
      authDomain: "sim-ab44f.firebaseapp.com",
      databaseURL: "https://sim-ab44f-default-rtdb.firebaseio.com",
      projectId: "sim-ab44f",
      storageBucket: "sim-ab44f.firebasestorage.app",
      messagingSenderId: "531235139954",
      appId: "1:531235139954:web:50ac39e7beecff0c522deb",
      measurementId: "G-C6M13CS7VV"
    };

    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const auth = getAuth(app);
    const db = getFirestore(app);
    let currentUser = null;

    const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const statusText = document.getElementById("status");

    const signUpBtn = document.getElementById("signupBtn");
    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");

    const loginBox = document.getElementById("loginBox");
    const sectionName = document.getElementById("sectionName");

    const game = document.getElementById("game");
    let gameUnlocked = 1;
    game.style.display = "none"; // for now!
    const moneyDis = document.getElementById("moneyDis");
    const papersDis = document.getElementById("papersDis");
    const workersHiredDis = document.getElementById("workersHiredDis");


    signUpBtn.onclick = async () => {
      try {
        await createUserWithEmailAndPassword(auth, emailInput.value, passwordInput.value);
        statusText.textContent = "Account created.";
        await sleep(600)
        loginBox.style.display = "none";
        game.style.display = "block";
        gameUnlocked = 1;
        sectionName.innerText = "9/5 Simulator Multiplayer";
      } catch (error) {
        statusText.textContent = error.message;
      }
    };

    loginBtn.onclick = async () => {
      try {
        await signInWithEmailAndPassword(auth, emailInput.value, passwordInput.value);
        statusText.textContent = "Logged in.";
        await sleep(600)
        loginBox.style.display = "none";
        game.style.display = "block";
        gameUnlocked = 1;
        sectionName.innerText = "9/5 Simulator Multiplayer";
      } catch (error) {
        statusText.textContent = error.message;
      }
    };

    logoutBtn.onclick = async () => {
      await signOut(auth);
      statusText.textContent = "Logged out.";
    };

    async function createSaveIfNeeded() {
        if (!currentUser) {
            statusText.textContent = "You must be logged in first.";
            return;
        }

        const saveRef = doc(db, "users", currentUser.uid, "save", "main");
        const saveSnap = await getDoc(saveRef);

        if (!saveSnap.exists()) {
            await setDoc(saveRef, {
            money: 0,
            papersWritten: 0,
            workersHired: 0,
            moneyPerClick: 1,
            workerCost: 50,
            createdAt: Date.now(),
            lastOnline: Date.now()
            });

            statusText.textContent = "New save created.";
        } else {
            statusText.textContent = "Save already exists.";
        }
        }

        startGameBtn.onclick = async () => {
        await createSaveIfNeeded();
    };

    onAuthStateChanged(auth, (user) => {
    if (user) {
        currentUser = user;

        statusText.textContent = "Logged in as: " + user.email;
        loginBox.style.display = "none";
        game.style.display = "block";

        console.log("User ID:", user.uid);
    } else {
        currentUser = null;

        statusText.textContent = "Not logged in.";
        loginBox.style.display = "block";
        game.style.display = "none";
    }
    });
  </script>

</body>
</html>
