<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="sectionName">9/5 Simulator Multiplayer</title>

<style>
    body {
      font-family: Arial, sans-serif;
      background: #ee9898;
      text-align: center;
    }

    input {
      display: block;
      margin: 10px auto;
      padding: 8px;
    }

    button {
      padding: 8px 12px;
      margin: 5px;
      cursor: pointer;
      border-radius: 5px;
    }

    #status {
      font-weight: bold;
    }

  </style>
</head>
<body>
<h1>9/5 Simulator Login</h1>

<input id="email" placeholder="Email">
<input id="password" placeholder="Password" type="password">

<button id="signupBtn">Sign Up</button>
<button id="loginBtn">Log In</button>
<button id="logoutBtn">Log Out</button>

    <p id="status"></p>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics.js";
    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB8xaqKa_oKDIVcjaIydsfmenEKmfqQsmo",
      authDomain: "sim-ab44f.firebaseapp.com",
      databaseURL: "https://sim-ab44f-default-rtdb.firebaseio.com",
      projectId: "sim-ab44f",
      storageBucket: "sim-ab44f.firebasestorage.app",
      messagingSenderId: "531235139954",
      appId: "1:531235139954:web:50ac39e7beecff0c522deb",
      measurementId: "G-C6M13CS7VV"
    };

    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const auth = getAuth(app);

    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const statusText = document.getElementById("status");

    document.getElementById("signupBtn").onclick = async () => {
      try {
        await createUserWithEmailAndPassword(auth, emailInput.value, passwordInput.value);
        statusText.textContent = "Account created.";
      } catch (error) {
        statusText.textContent = error.message;
      }
    };

    document.getElementById("loginBtn").onclick = async () => {
      try {
        await signInWithEmailAndPassword(auth, emailInput.value, passwordInput.value);
        statusText.textContent = "Logged in.";
      } catch (error) {
        statusText.textContent = error.message;
      }
    };

    document.getElementById("logoutBtn").onclick = async () => {
      await signOut(auth);
      statusText.textContent = "Logged out.";
    };

    onAuthStateChanged(auth, (user) => {
      if (user) {
        statusText.textContent = "Logged in as: " + user.email;
        console.log("User ID:", user.uid);
      } else {
        statusText.textContent = "Not logged in.";
      }
    });
  </script>

</body>
</html>
